name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      # Not `npm run validate`: validate:publish installs from the default
      # branch on GitHub, so on a PR it would check main, not this commit.
      - run: npm run validate:skill
